<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181d26" />
    <meta
      name="description"
      content="BIMAA SuperConnector: the exclusive alumni network for students of BIM, Trichy. Enrol, get matched into small circles, and meet on the third weekend of every month."
    />
    <!--
      Link-preview (Open Graph / Twitter) metadata. Crawlers (WhatsApp,
      LinkedIn, Slack, iMessage, X...) do NOT run JavaScript, so these
      tags must be static HTML here, and every URL must be absolute.
      The image file lives in the site itself (public/assets/branding/
      og-image.jpg, 1200x630, kept under 300 KB because WhatsApp ignores larger images) — GitHub's repo "Social preview" setting only
      applies to github.com links, never to the GitHub Pages site.
      Bump the ?v= number whenever the image changes so platforms that
      cache previews (WhatsApp, LinkedIn) fetch the new one.
    -->
    <link rel="canonical" href="https://bimaasuperconnector.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BIMAA SuperConnector" />
    <meta property="og:title" content="BIMAA SuperConnector | BIM, Trichy alumni network" />
    <meta
      property="og:description"
      content="The exclusive alumni network for students of BIM, Trichy. Enrol, get matched into small circles, and meet on the third weekend of every month."
    />
    <meta property="og:url" content="https://bimaasuperconnector.github.io/" />
    <meta property="og:image" content="https://bimaasuperconnector.github.io/assets/branding/og-image.jpg?v=2" />
    <meta property="og:image:secure_url" content="https://bimaasuperconnector.github.io/assets/branding/og-image.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BIMAA SuperConnector, the alumni network for BIM, Trichy" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BIMAA SuperConnector | BIM, Trichy alumni network" />
    <meta
      name="twitter:description"
      content="The exclusive alumni network for students of BIM, Trichy. Enrol, get matched into small circles, and meet on the third weekend of every month."
    />
    <meta name="twitter:image" content="https://bimaasuperconnector.github.io/assets/branding/og-image.jpg?v=2" />
    <meta name="twitter:image:alt" content="BIMAA SuperConnector, the alumni network for BIM, Trichy" />

    <link rel="icon" href="/assets/branding/logo.ico" />
    <link rel="apple-touch-icon" href="/assets/branding/logo-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>BIMAA SuperConnector | BIM, Trichy alumni network</title>
    <script>
      // Restore the original deep-linked path saved by 404.html before
      // React Router mounts, so a hard refresh/direct link to e.g.
      // /app/directory renders that route instead of the landing page.
      (function () {
        var redirect = sessionStorage.getItem('sc-redirect');
        if (redirect) {
          sessionStorage.removeItem('sc-redirect');
          if (redirect !== location.pathname + location.search + location.hash) {
            history.replaceState(null, '', redirect);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
