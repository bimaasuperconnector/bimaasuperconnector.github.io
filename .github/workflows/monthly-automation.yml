name: Monthly Automation

on:
  schedule:
    # Runs once a day. Per AUTOMATION.md, GitHub Actions cron is not an
    # exact real-time scheduler — each job decides internally what (if
    # anything) is actually due, rather than trusting this fired at a
    # precise moment. 03:00 UTC = 08:30 IST, comfortably outside
    # daytime hours.
    - cron: '0 3 * * *'
  workflow_dispatch: {} # lets the owner trigger a run manually from the Actions tab

permissions:
  contents: read

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation/package-lock.json

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Run automation
        working-directory: automation
        env:
          # This is a REAL secret — the Firebase service account key
          # JSON, not the public web client config used by deploy.yml.
          # It grants full Admin SDK access, bypassing every Firestore
          # Rule in this project. Stored as a GitHub Actions Secret
          # (Settings -> Secrets and variables -> Actions -> Secrets
          # tab), never as a repository Variable. See the chat setup
          # instructions for how it was generated.
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          # Phase 8: authorizes bimaasuperconnector@gmail.com to create
          # Calendar events/Meet links as itself (never anyone's
          # password). All three are real secrets. If any are unset,
          # calendarJob.ts logs and skips gracefully rather than
          # failing the whole run — Phases 1-7 keep working either way.
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          GOOGLE_CALENDAR_REFRESH_TOKEN: ${{ secrets.GOOGLE_CALENDAR_REFRESH_TOKEN }}
        run: npm start
